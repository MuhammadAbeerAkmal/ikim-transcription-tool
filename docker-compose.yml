services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.example
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ikim -d transcription_tool"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ikim:ikim@db:5432/transcription_tool
      PORT: "4000"
    ports:
      - "4000:4000"
    volumes:
      - backend_storage:/app/storage

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
  backend_storage:
